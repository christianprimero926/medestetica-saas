services:
  postgres:
    image: postgres:16-alpine
    container_name: medestetica-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: medestetica
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medestetica_secret}
      POSTGRES_DB: medestetica
    ports:
      - "54333:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medestetica -d medestetica"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medestetica-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://medestetica:${POSTGRES_PASSWORD:-medestetica_secret}@postgres:5432/medestetica?schema=public
      # Define estos secretos en un .env junto al compose para producción.
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-long-random-string}
      TENANT_SECRETS_KEY: ${TENANT_SECRETS_KEY:-dev-tenant-secrets-change-in-production-min-32-chars}
      JWT_EXPIRES_IN: 8h
      PORT: 3001
      # Hora local del consultorio: el horario de atención (weeklyHours) y los
      # slots de agendamiento se interpretan en esta zona.
      TZ: ${TZ:-America/Bogota}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      # URL pública del sitio: arma el QR de verificación de firmas.
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      # Correo saliente (copias de consentimientos, etc.). Vacío = deshabilitado.
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Agente IA del CRM WhatsApp (Claude). Vacío = agente deshabilitado.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-8}
      # Carga datos demo en cada arranque. Poner "false" en producción.
      SEED_ON_START: ${SEED_ON_START:-true}
    ports:
      - "3001:3001"
    # La multimedia por tenant vive fuera del contenedor: sin este volumen,
    # cada rebuild borra todas las imágenes subidas.
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medestetica-web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      API_URL_INTERNAL: http://backend:3001
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  backend_uploads:
